<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ef" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Qaita" />
    <meta name="description" content="Qaita — упражнения для руки дома после инсульта. Камера считает повторы и подсказывает голосом, как исправить движение." />
    <title>Qaita — упражнения для руки дома</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231d7552'/%3E%3Crect x='4.5' y='4.5' width='55' height='55' rx='14' fill='none' stroke='%23fff6e4' stroke-opacity='.5' stroke-width='1.5' stroke-dasharray='3 3'/%3E%3Cpath d='M50.5 29.0L55.5 29.0M49.0 36.5L53.6 38.4M31.0 48.5L31.0 53.5M23.5 47.0L21.6 51.6M17.2 42.8L13.7 46.3M13.0 36.5L8.4 38.4M11.5 29.0L6.5 29.0M13.0 21.5L8.4 19.6M17.2 15.2L13.7 11.7M23.5 11.0L21.6 6.4M31.0 9.5L31.0 4.5M38.5 11.0L40.4 6.4M44.8 15.2L48.3 11.7M49.0 21.5L53.6 19.6' stroke='%23e0a33a' stroke-width='2.4' stroke-linecap='round'/%3E%3Cg stroke='%23f6ecd6' stroke-width='2.3' stroke-linecap='round' fill='none'%3E%3Cpath d='M26 18.5Q24 29 26 39.5M31 17V41M36 18.5Q38 29 36 39.5M20.5 24Q31 22 41.5 24M19 29H43M20.5 34Q31 36 41.5 34'/%3E%3C/g%3E%3Ccircle cx='31' cy='29' r='14.5' fill='none' stroke='%23ffd66b' stroke-width='5'/%3E%3Cpath d='M36.5 36.5Q42 44 50 45' stroke='%23ffd66b' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифт не блокирует запуск: если Google Fonts недоступен или молчит, приложение стартует на системном шрифте. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="app" class="app">
      <main class="stage" id="stage" aria-live="polite"></main>
      <div class="rotate-hint" aria-live="polite"><span aria-hidden="true">📱</span><b>Поверните телефон горизонтально — так камере видно всю руку</b><button type="button" class="rotate-hint-close" aria-label="Скрыть подсказку" onclick="this.parentElement.hidden = true">✕</button></div>
      <!-- Подсказку «Поверните» прячем сами через 20 с: она не должна навсегда закрывать низ экрана (QA 30.09). -->
      <script>setTimeout(() => { const h = document.querySelector('.rotate-hint'); if (h) h.hidden = true; }, 20000);</script>
      <div class="status-toast" id="status-toast" role="status" aria-live="assertive"></div>
      <div class="repeat-toast" id="repeat-toast" role="status" aria-live="polite" data-show="false"></div>
      <!-- Заставка до загрузки приложения: звезда собирается из искр, советы сменяются. Чистый CSS, исчезает сама,
           как только появится первый экран (.stage не пустой). Стили здесь — main.css ещё не загружен. -->
      <div class="boot" aria-hidden="true">
        <style>
          .boot{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:18px;background:#faf6ef;color:#1c2a25;font:600 24px/1.3 system-ui,sans-serif;text-align:center;padding:16px;transition:opacity .45s ease,visibility .45s}
          .stage:not(:empty)~.boot{opacity:0;visibility:hidden}
          .stage:not(:empty)~.boot *{animation-play-state:paused}
          .boot svg{width:132px;height:132px;overflow:visible}
          .boot b{font-size:40px;font-weight:800;color:#1d7552;letter-spacing:-.01em}
          .boot-tips{position:relative;height:1.4em;width:min(90vw,560px);color:#4b5a54}
          .boot-tips span{position:absolute;inset:0;opacity:0;animation:boot-tip 10.5s infinite}
          .boot-tips span:nth-child(2){animation-delay:3.5s}.boot-tips span:nth-child(3){animation-delay:7s}
          .bt-s{fill:#e7a41f;transform-box:fill-box;transform-origin:center;animation:bt-in 1s var(--d) cubic-bezier(.23,1,.32,1) both,bt-tw 2.4s calc(var(--d) + 1s) ease-in-out infinite}
          .bt-star{fill:#ffd66b;stroke:#e7a41f;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:bt-star .7s .6s cubic-bezier(.34,1.56,.64,1) both,bt-pulse 1.8s 1.3s ease-in-out infinite}
          @keyframes bt-in{from{transform:translate(calc(var(--x)*2.4),calc(var(--y)*2.4)) scale(.3);opacity:0}to{transform:translate(var(--x),var(--y));opacity:1}}
          @keyframes bt-tw{50%{transform:translate(var(--x),var(--y)) scale(.6);opacity:.4}}
          @keyframes bt-star{from{transform:scale(0) rotate(-120deg);opacity:0}}
          @keyframes bt-pulse{50%{transform:scale(1.08)}}
          @keyframes boot-tip{0%,2%{opacity:0;transform:translateY(8px)}6%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
          @media (prefers-reduced-motion:reduce){.boot *{animation:none!important}.bt-s{transform:translate(var(--x),var(--y))}.boot-tips span:first-child{opacity:1}}
        </style>
        <svg viewBox="0 0 64 64">
          <circle class="bt-s" style="--x:34px;--y:0px;--d:0ms" cx="32" cy="31" r="2.6"/><circle class="bt-s" style="--x:24px;--y:24px;--d:70ms" cx="32" cy="31" r="2.6"/>
          <circle class="bt-s" style="--x:0px;--y:34px;--d:140ms" cx="32" cy="31" r="2.6"/><circle class="bt-s" style="--x:-24px;--y:24px;--d:210ms" cx="32" cy="31" r="2.6"/>
          <circle class="bt-s" style="--x:-34px;--y:0px;--d:280ms" cx="32" cy="31" r="2.6"/><circle class="bt-s" style="--x:-24px;--y:-24px;--d:350ms" cx="32" cy="31" r="2.6"/>
          <circle class="bt-s" style="--x:0px;--y:-34px;--d:420ms" cx="32" cy="31" r="2.6"/><circle class="bt-s" style="--x:24px;--y:-24px;--d:490ms" cx="32" cy="31" r="2.6"/>
          <path class="bt-star" d="M32 13l5.4 11 12.1 1.8-8.8 8.5 2.1 12L32 40.6 21.2 46.3l2.1-12-8.8-8.5 12.1-1.8z"/>
        </svg>
        <b>Qaita</b>
        <div class="boot-tips"><span>Сядьте лицом к свету</span><span>Камера — на уровне груди, примерно в метре</span><span>Видео никуда не отправляется</span></div>
      </div>
      <div class="audio-chip" id="audio-chip" data-show="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
        <span>Звук — коснитесь экрана</span>
      </div>
    </div>
    <!-- Единственное видео приложения: экраны переносят его к себе, в остальное время оно «на парковке».
         Не display:none — иначе браузер перестаёт отдавать кадры, и движок слепнет. -->
    <div class="cam-park" id="cam-park" aria-hidden="true"><video id="camera" autoplay playsinline muted></video></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
