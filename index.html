<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ef" />
    <meta name="description" content="Qaita — упражнения для руки дома после инсульта. Камера считает повторы и подсказывает голосом, как исправить движение." />
    <title>Qaita — упражнения для руки дома</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231d7552'/%3E%3Cpath d='M32 13l5.4 11 12.1 1.8-8.8 8.5 2.1 12L32 40.6 21.2 46.3l2.1-12-8.8-8.5 12.1-1.8z' fill='%23ffd66b'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app" class="app">
      <main class="stage" id="stage" aria-live="polite"></main>
      <div class="rotate-hint" aria-live="polite"><span aria-hidden="true">📱</span>Поверните телефон горизонтально — так камере видно всю руку</div>
      <div class="status-toast" id="status-toast" role="status" aria-live="assertive"></div>
      <div class="repeat-toast" id="repeat-toast" role="status" aria-live="polite" data-show="false"></div>
      <div class="audio-chip" id="audio-chip" data-show="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
        <span>Звук — коснитесь экрана</span>
      </div>
    </div>
    <!-- Единственное видео приложения: экраны переносят его к себе, в остальное время оно «на парковке».
         Не display:none — иначе браузер перестаёт отдавать кадры, и движок слепнет. -->
    <div class="cam-park" id="cam-park" aria-hidden="true"><video id="camera" autoplay playsinline muted></video></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
